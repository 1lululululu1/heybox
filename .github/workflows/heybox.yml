name: Heybox tasks

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: Script to run
        required: true
        type: choice
        default: heybox_sign
        options:
          - heybox_sign
          - heybox_claim
          - heybox_rush
          - heybox_roll

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Heybox secret
        env:
          HEYBOX_CK: ${{ secrets.HEYBOX_CK }}
        run: |
          if [[ -z "$HEYBOX_CK" ]]; then
            echo "::error::Configure the HEYBOX_CK repository secret."
            exit 1
          fi

      - name: Run selected script
        env:
          heybox_ck: ${{ secrets.HEYBOX_CK }}
          SCRIPT: ${{ inputs.script || 'heybox_sign' }}
        run: npm run "$SCRIPT"
